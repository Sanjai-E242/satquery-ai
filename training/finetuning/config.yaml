training:
  base_model_name: "Salesforce/blip-vqa-base"
  parquet_path: "data/BigEarthNet/BigEarthNet.txt.parquet"
  image_root: "data/BigEarthNet/images"
  checkpoint_dir: "checkpoints/rs_vlm_lora"
  max_samples: 100
  batch_size: 4
  epochs: 3
  learning_rate: 1e-4
  device: "auto"
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["query", "value"]
